emit:
  - "@typespec/openapi3"
  - "@typespec/json-schema"
  - "@typespec/protobuf"
options:
  "@typespec/openapi3":
    emitter-output-dir: "{project-root}/gen/openapi"
    openapi-versions:
      - 3.1.0
  "@typespec/json-schema":
    emitter-output-dir: "{project-root}/gen/json-schema"
    file-type: json
  "@typespec/protobuf":
    emitter-output-dir: "{project-root}/gen/protobuf"
